name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint, module boundaries, forbidden claims, formatting)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: Database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway PostgreSQL for this run only: these passwords protect nothing and are not secrets.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: va_admin
          POSTGRES_PASSWORD: ci-admin-password
          POSTGRES_DB: virtus_assets
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U va_admin -d virtus_assets"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.10.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: va_admin
      POSTGRES_PASSWORD: ci-admin-password
      POSTGRES_DB: virtus_assets
      POSTGRES_TEST_DB: virtus_assets_test
      DB_MIGRATOR_PASSWORD: ci-migrator-password
      DB_APP_PASSWORD: ci-app-password
      DB_AUTH_PASSWORD: ci-auth-password
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef
      DEMO_ACCOUNTS_PASSWORD: ci-demo-accounts-password
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration tests (roles, row level security, append-only, migrations, authentication)
        run: pnpm test:integration

      - name: Demo database can be reset twice in a row
        run: pnpm db:reset && pnpm db:reset

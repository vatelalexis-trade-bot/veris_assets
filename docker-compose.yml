# Local services for development and demo only. Values come from .env (created by `pnpm dev`).
# Every port is bound to 127.0.0.1: nothing is reachable from outside the Codespace
# except through GitHub's private port forwarding.
name: virtus-assets

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing, run pnpm dev once to create .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing, run pnpm dev once to create .env}
      POSTGRES_DB: ${POSTGRES_DB:?missing, run pnpm dev once to create .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.2-alpine
    # Cache and rate limiting only: no persistence needed.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible document storage (decision D-005). Initialised by scripts/init-storage.sh.
  garage:
    image: dxflrs/garage:v2.4.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?missing, run pnpm dev once to create .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?missing, run pnpm dev once to create .env}
    ports:
      - '127.0.0.1:${S3_PORT:-3900}:3900'
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 20

  # Test mail server: captures every email; web interface on port 8025.
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - '127.0.0.1:${SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

  # Optional: traces, metrics and logs viewer. Start with `docker compose --profile observability up -d`.
  otel-lgtm:
    image: grafana/otel-lgtm:0.33.1
    profiles: ['observability']
    ports:
      - '127.0.0.1:3001:3000'
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'

volumes:
  postgres-data:
  garage-meta:
  garage-data:
